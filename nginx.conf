server {
    listen ${PORT};
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # --- compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- security headers (no add_header in the locations below, so these inherit) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- hashed build output: cache for a year -----------------------------
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # --- your photos: cache for a week (filenames are not hashed) ----------
    location /images/ {
        try_files $uri =404;
        expires 7d;
    }

    # --- everything else: serve the app; never cache index.html ------------
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
