# Production preview (nginx):    docker compose up --build        -> http://localhost:8080
# Live-edit dev server (Vite):   docker compose --profile dev up dev   -> http://localhost:5173

services:
  web:
    build: .
    image: benaka-portfolio:latest
    container_name: benaka-portfolio
    ports:
      - "8080:80"
    restart: unless-stopped

  dev:
    profiles: ["dev"]
    image: node:22-alpine
    container_name: benaka-portfolio-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules

volumes:
  dev_node_modules:
